[package]
name = "tpt-proc-core"
description = "Core domain types for process engineering: material streams, compositions, unit operations, flowsheets"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["process-engineering", "chemical-engineering", "simulation"]
categories = ["science", "simulation"]

[features]
# Serde (de)serialization for streams, unit operations, and flowsheets.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

